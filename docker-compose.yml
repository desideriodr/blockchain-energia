services:

  # ─────────────────────────────────────────
  # PostgreSQL — Base de datos principal
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: blockchain-energia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-energia_user}
      POSTGRES_PASSWORD: ${DB_PASS:-energia_pass}
      POSTGRES_DB: ${DB_NAME:-blockchain_energia}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-energia_user} -d ${DB_NAME:-blockchain_energia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis — Caché + Cola BullMQ
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: blockchain-energia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Hardhat Node — Blockchain local
  # ─────────────────────────────────────────
  hardhat:
    image: node:20-alpine
    container_name: blockchain-energia-chain
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      - ./smart-contracts:/app
    command: >
      sh -c "npm install --silent &&
             npx hardhat node --hostname 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8545 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
