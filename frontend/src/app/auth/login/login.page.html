<div class="login-page">
    <div class="login-form">
        <h2>Iniciar Sesión</h2>

        <div class="input-group">
            <span class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="1.5"
                        d="M5 20v-1a7 7 0 0 1 7-7v0a7 7 0 0 1 7 7v1m-7-8a4 4 0 1 0 0-8a4 4 0 0 0 0 8" />
                </svg>
            </span>

            <input [(ngModel)]="email" type="email" placeholder="Email" />
        </div>

        <div class="input-group">
            <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32">
                    <path fill="currentColor"
                        d="M21 2a8.998 8.998 0 0 0-8.612 11.612L2 24v6h6l10.388-10.388A9 9 0 1 0 21 2m0 16a7 7 0 0 1-2.032-.302l-1.147-.348l-.847.847l-3.181 3.181L12.414 20L11 21.414l1.379 1.379l-1.586 1.586L9.414 23L8 24.414l1.379 1.379L7.172 28H4v-3.172l9.802-9.802l.848-.847l-.348-1.147A7 7 0 1 1 21 18" />
                    <circle cx="22" cy="10" r="2" fill="currentColor" />
                </svg></span>
            <input [(ngModel)]="password" type="password" placeholder="Contraseña" />
        </div>

        <button class="login-button" [disabled]="loading" (click)="submit()">
            <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2">
                        <path d="M15 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2" />
                        <path d="M21 12H8l3-3m0 6l-3-3" />
                    </g>
                </svg></span> {{ loading ? 'Cargando...' : 'Entrar' }}
        </button>

        <div *ngIf="errorMsg">
            {{ errorMsg }}
        </div>

        <a routerLink="/signup">
            Crear cuenta
        </a>
    </div>
</div>
