<div class="signup-page">
  <div class="brand-panel">
    <!-- idéntico al login -->
    <div class="brand-content">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24">
          <path fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2"
                d="m6 14l7-12v8h5l-7 12v-8z"/>
        </svg>
      </div>
      <h1 class="brand-name">P2P ECS</h1>
      <p class="brand-tagline">Energía entre pares.<br/>Inteligente y sostenible.</p>
      <div class="brand-stats">
        <div class="stat"><span class="stat-value">100%</span><span class="stat-label">Energía limpia</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><span class="stat-value">P2P</span><span class="stat-label">Sin intermediarios</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><span class="stat-value">24/7</span><span class="stat-label">Monitoreo</span></div>
      </div>
    </div>
  </div>

  <div class="form-panel">
    <div class="login-card">
      <form (ngSubmit)="submit()" #signupForm="ngForm">

        <div class="card-header">
          <h2>Crear cuenta</h2>
          <p>Únete a la red de energía P2P</p>
        </div>

        <div class="form-row">
          <div class="input-group">
            <span class="icon"><svg width="18" height="18" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"><circle cx="24" cy="11" r="7"/><path d="M4 41c0-8.837 8.059-16 18-16m9 17l10-10l-4-4l-10 10v4z"/></g></svg></span>
            <input name="nombres" [(ngModel)]="nombres" placeholder="Nombres" required/>
          </div>

          <div class="input-group">
            <span class="icon"><svg width="18" height="18" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"><circle cx="24" cy="11" r="7"/><path d="M4 41c0-8.837 8.059-16 18-16m9 17l10-10l-4-4l-10 10v4z"/></g></svg></span>
            <input name="apellidos" [(ngModel)]="apellidos" placeholder="Apellidos" required/>
          </div>
        </div>

        <div class="input-group">
          <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M5 5h13a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3m0 1c-.5 0-.94.17-1.28.47l7.78 5.03l7.78-5.03C18.94 6.17 18.5 6 18 6zm6.5 6.71L3.13 7.28C3.05 7.5 3 7.75 3 8v9a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V8c0-.25-.05-.5-.13-.72z"/></svg></span>
          <input name="email" [(ngModel)]="email" type="email" placeholder="Email" required/>
        </div>

        <div class="input-group">
          <span class="icon"><svg width="18" height="18" viewBox="0 0 32 32"><path fill="currentColor" d="M21 2a8.998 8.998 0 0 0-8.612 11.612L2 24v6h6l10.388-10.388A9 9 0 1 0 21 2m0 16a7 7 0 0 1-2.032-.302l-1.147-.348l-.847.847l-3.181 3.181L12.414 20L11 21.414l1.379 1.379l-1.586 1.586L9.414 23L8 24.414l1.379 1.379L7.172 28H4v-3.172l9.802-9.802l.848-.847l-.348-1.147A7 7 0 1 1 21 18"/><circle cx="22" cy="10" r="2" fill="currentColor"/></svg></span>
          <input name="password" [(ngModel)]="password" type="password" placeholder="Contraseña" required/>
        </div>

        <div *ngIf="errorMsg" class="error-msg">
          <svg width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10s10-4.48 10-10S17.52 2 12 2m1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>
          {{ errorMsg }}
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading || signupForm.invalid">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19c0-2.21-2.686-4-6-4s-6 1.79-6 4m16-3v-3m0 0v-3m0 3h-3m3 0h3M9 12a4 4 0 1 1 0-8a4 4 0 0 1 0 8"/></svg>
          {{ loading ? 'Creando...' : 'Registrarse' }}
        </button>

        <div class="card-footer">
          <span>¿Ya tienes cuenta?</span>
          <a routerLink="/">Iniciar sesión</a>
        </div>

      </form>
    </div>
  </div>
</div>
