<div class="signup-page">
  <div class="signup-form">

    <form (ngSubmit)="submit()" #signupForm="ngForm">

      <h2>Crear Cuenta</h2>

      <div class="input-group">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 48 48">
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
              <circle cx="24" cy="11" r="7" />
              <path d="M4 41c0-8.837 8.059-16 18-16m9 17l10-10l-4-4l-10 10v4z" />
            </g>
          </svg></span>
        <input name="nombres" [(ngModel)]="nombres" placeholder="Nombres" required />
      </div>

      <div class="input-group">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 48 48">
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
              <circle cx="24" cy="11" r="7" />
              <path d="M4 41c0-8.837 8.059-16 18-16m9 17l10-10l-4-4l-10 10v4z" />
            </g>
          </svg></span>
        <input name="apellidos" [(ngModel)]="apellidos" placeholder="Apellidos" required />
      </div>

      <div class="input-group">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path fill="currentColor"
              d="M5 5h13a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3m0 1c-.5 0-.94.17-1.28.47l7.78 5.03l7.78-5.03C18.94 6.17 18.5 6 18 6zm6.5 6.71L3.13 7.28C3.05 7.5 3 7.75 3 8v9a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V8c0-.25-.05-.5-.13-.72z" />
          </svg></span>
        <input name="email" [(ngModel)]="email" type="email" placeholder="Email" required />
      </div>

      <div class="input-group">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32">
            <path fill="currentColor"
              d="M21 2a8.998 8.998 0 0 0-8.612 11.612L2 24v6h6l10.388-10.388A9 9 0 1 0 21 2m0 16a7 7 0 0 1-2.032-.302l-1.147-.348l-.847.847l-3.181 3.181L12.414 20L11 21.414l1.379 1.379l-1.586 1.586L9.414 23L8 24.414l1.379 1.379L7.172 28H4v-3.172l9.802-9.802l.848-.847l-.348-1.147A7 7 0 1 1 21 18" />
            <circle cx="22" cy="10" r="2" fill="currentColor" />
          </svg></span>
        <input name="password" [(ngModel)]="password" type="password" placeholder="Contraseña" required />
      </div>

      <button type="submit" class="signup-button" [disabled]="loading || signupForm.invalid">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 19c0-2.21-2.686-4-6-4s-6 1.79-6 4m16-3v-3m0 0v-3m0 3h-3m3 0h3M9 12a4 4 0 1 1 0-8a4 4 0 0 1 0 8" />
          </svg></span>{{ loading ? 'Creando...' : 'Registrarse' }}
      </button>

      <div *ngIf="errorMsg">
        {{ errorMsg }}
      </div>

      <a routerLink="/">
        Ya tengo cuenta
      </a>

    </form>

  </div>
</div>
