<header class="topbar">
    <ng-container *ngIf="me$ | async as me">

        <div class="left">
            <!-- Opcional: título -->
            <!-- <strong>Dashboard</strong> -->
        </div>

        <div class="center">
            <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2"
                        d="m6 14l7-12v8h5l-7 12v-8z" />
                </svg> {{ me.wallet.energyStored | number:'1.0-2' }} KWh</span>
            <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0" />
                        <path d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 1 0 0 4h2a2 2 0 1 1 0 4h-2a2 2 0 0 1-1.8-1M12 7v10" />
                    </g>
                </svg> {{ me.wallet.balanceCop | number:'1.4-6' }} COP</span>
        </div>

        <div class="right">
            <span class="user">
                {{ me.nombres }} {{ me.apellidos }}
            </span>

            <button (click)="logout()"> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2"
                        d="m12 15l3-3m0 0l-3-3m3 3H4m0-4.752V7.2c0-1.12 0-1.68.218-2.108c.192-.377.497-.682.874-.874C5.52 4 6.08 4 7.2 4h9.6c1.12 0 1.68 0 2.107.218c.377.192.683.497.875.874c.218.427.218.987.218 2.105v9.607c0 1.118 0 1.677-.218 2.104a2 2 0 0 1-.875.874c-.427.218-.986.218-2.104.218H7.197c-1.118 0-1.678 0-2.105-.218a2 2 0 0 1-.874-.874C4 18.48 4 17.92 4 16.8v-.05" />
                </svg><span class="icon">Salir</span></button>
        </div>

    </ng-container>
</header>
