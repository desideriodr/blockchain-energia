<header class="page-header">
  <h1>Mis contratos</h1>
</header>

<section class="contracts card">
  <table class="contracts-table">
    <thead>
      <tr>
        <th>Vendedor</th>
        <th>Comprador</th>
        <th>Precio (COP/kWh)</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody *ngIf="contracts$ | async as contracts">
      <ng-container *ngFor="let contract of contracts">

        <!-- FILA PRINCIPAL -->
        <tr class="row"
            (click)="toggle(contract.id)"
            [class.active]="contract.id === selectedContractId">

          <td>{{ getFullName(contract.seller) }}</td>
          <td>{{ getFullName(contract.buyer) }}</td>
          <td>{{ contract.pricePerKwhCop | number:'1.0-0' }}</td>
          <td>
            <span class="status-badge" [ngClass]="'status-' + contract.status.toLowerCase()">
              {{ statusLabel(contract.status) }}
            </span>
          </td>
          <td>
            <button *ngIf="contract.status === ContractStatus.ACTIVE"
                    (click)="$event.stopPropagation(); cancel(contract.id)"
                    [disabled]="loading">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0m15.364-6.364L5.636 18.364" />
              </svg>
              Cancelar
            </button>
          </td>
        </tr>

        <!-- DETALLE INLINE -->
        <tr *ngIf="contract.id === selectedContractId" class="detail-row">
          <td colspan="5">
            <app-contract-detail-inline [contractId]="selectedContractId!"></app-contract-detail-inline>
          </td>
        </tr>

      </ng-container>

      <!-- Mensaje si no hay contratos -->
      <tr *ngIf="contracts.length === 0">
        <td colspan="5" class="no-contracts">
          No hay contratos en este momento.
        </td>
      </tr>
    </tbody>
  </table>
</section>
