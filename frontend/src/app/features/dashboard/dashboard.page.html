<div class="dashboard-content">

  <ng-container *ngIf="dashboardEnergyFinancial$ | async as data">

    <app-energy-chart
      [hourlyEnergy]="data.hourlyEnergy"
      [monthlyEnergy]="data.monthlyEnergy"
      [sourceDistribution]="data.sourceDistribution">
    </app-energy-chart>

    <app-transactions-chart
      [hourlyFinancial]="data.hourlyFinancial">
    </app-transactions-chart>

  </ng-container>

</div>
